[project]
name = "telemetry-investigation-agents"
version = "0.1.0"
description = "Controlled LangGraph telemetry investigation workflow portfolio project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.14.1",
    "opentelemetry-exporter-otlp>=1.42.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "mypy>=2.0.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.pyright]
typeCheckingMode = "standard"

reportMissingParameterType = "warning"
reportUnknownParameterType = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportMissingTypeStubs = "none"

[project.scripts]
telemetry-evals = "telemetry_agents.evaluation_cli.run_evals:main"
telemetry-demo-reset = "telemetry_agents.demo_cli.reset_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_agents"]
artifacts = [
    "src/telemetry_agents/infrastructure/prompts/*.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/telemetry_agents/infrastructure/prompts/*.md",
]
